name: windows-build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Generate icon
        run: python tools/make_icon.py

      - name: Generate build info
        run: python tools/make_build_info.py

      - name: Build
        run: pyinstaller --noconfirm xmdms.spec

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/xmdms/* -DestinationPath xmdms-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: xmdms-windows-x64
          path: xmdms-windows-x64.zip
          retention-days: 30
